name: deploy

# Migrations before deploy, always — the CI job must fail if the migration
# step fails (docs/RUNBOOK.md §2). Staging runs on every push to main;
# production is gated behind a version tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Named wrangler environments do not inherit bindings — a deploy can
      # silently succeed without LIVE_PIN (it did once: pins created with no
      # position). Dry-run each env and assert the DO binding is present.
      # (The ASSETS binding is never printed in this table; the post-deploy
      # smoke test below is what actually proves it works.)
      - run: npx wrangler deploy --env staging --dry-run --outdir /tmp/dryrun-staging | tee /tmp/dryrun-staging.log
      - run: grep -q "LIVE_PIN" /tmp/dryrun-staging.log
      - run: npx wrangler deploy --env production --dry-run --outdir /tmp/dryrun-production | tee /tmp/dryrun-production.log
      - run: grep -q "LIVE_PIN" /tmp/dryrun-production.log

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations (staging)
        run: npx wrangler d1 migrations apply findme-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker (staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Exercises the Worker-served paths: / (static asset), an unmatched URL
      # (404 page — 500s if the Worker assumes an ASSETS binding the named
      # env doesn't have), and the worker-rendered privacy page. Retries for
      # up to ~2 min because the edge can briefly serve the previous version.
      - name: Smoke test (staging)
        run: |
          check() { for i in $(seq 1 12); do if "$@" >/dev/null 2>&1; then return 0; fi; sleep 10; done; "$@"; }
          check sh -c 'curl -fsS --max-time 30 https://findme-staging.ptrees.workers.dev/ | grep -q "Find Me"'
          check sh -c 'test "$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" https://findme-staging.ptrees.workers.dev/no-such-page)" = "404"'
          check sh -c 'curl -fsS --max-time 30 https://findme-staging.ptrees.workers.dev/privacy | grep -q "There are no accounts"'

  deploy-production:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply findme --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker (production)
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
